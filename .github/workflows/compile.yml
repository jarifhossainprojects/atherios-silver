name: Build Flash SWF

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Download Flex SDK
      run: |
        wget -q https://archive.apache.org/dist/flex/4.16.1/binaries/apache-flex-sdk-4.16.1-bin.tar.gz
        tar -xzf apache-flex-sdk-4.16.1-bin.tar.gz
        chmod +x apache-flex-sdk-4.16.1-bin/bin/mxmlc

    - name: Compile ActionScript to SWF
      run: |
        ./apache-flex-sdk-4.16.1-bin/bin/mxmlc Main.as -output atherios-silver.swf -static-link-runtime-shared-libraries=true

    - name: Upload SWF File
      uses: actions/upload-artifact@v4
      with:
        name: atherios-silver-swf
        path: atherios-silver.swf
