name: Hax SWF Compiler

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Haxe Engine
        uses: kxck/setup-haxe@v1
        with:
          haxe-version: 4.3.1

      - name: Install Haxe Dependencies
        run: |
          haxelib install lime --silent
          haxelib install openfl --silent
          haxelib install flixel --silent
          haxelib install flixel-addons --silent
          haxelib run lime setup

      - name: Clean & Build Flash SWF
        run: |
          haxelib run lime build flash -clean

      - name: Upload atherios-silver.swf
        uses: actions/upload-artifact@v4
        with:
          name: atherios-silver-swf
          path: export/flash/bin/atherios-silver.swf
