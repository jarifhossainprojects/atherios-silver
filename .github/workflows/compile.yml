name: Build Flash SWF

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install Flex & AIR SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y flex bison lib32z1 lib32ncurses6 lib32stdc++6
        wget https://raw.githubusercontent.com/airdeck/actionscript-compiler/main/mxmlc -O mxmlc || true

    - name: Setup Java 8
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Compile ActionScript to SWF
      run: |
        # Download standalone lightweight Flash compiler
        wget https://github.com/bowlerhat/actionscript-compiler-action/releases/download/v1.0.0/mxmlc.jar -O mxmlc.jar
        java -jar mxmlc.jar Main.as -output atherios-silver.swf

    - name: Upload SWF File Artifact
      uses: actions/upload-artifact@v3
      with:
        name: atherios-silver-swf
        path: atherios-silver.swf
