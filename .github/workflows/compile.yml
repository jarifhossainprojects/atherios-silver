name: Hax SWF Compiler

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup Haxe Engine
        uses: kamilkf/setup-haxe@v1
        with:
          haxe-version: 4.3.1

      - name: Install Haxe Dependencies
        run: |
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib run lime setup

      - name: Build Flash SWF
        run: |
          haxelib run lime build flash

      - name: Upload atherios-silver.swf
        uses: actions/upload-artifact@v3
        with:
          name: atherios-silver-swf
          path: export/flash/bin/atherios-silver.swf
