name: Build Flash SWF

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Haxe Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y haxe

    - name: Compile Haxe directly to SWF
      run: |
        haxe -main Main -swf atherios-silver.swf -swf-header 800:600:60:ffffff

    - name: Upload SWF File Artifact
      uses: actions/upload-artifact@v4
      with:
        name: atherios-silver-swf
        path: atherios-silver.swf
