name: Build Flash SWF

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Download Standalone Compiler
      run: |
        wget https://github.com/bowlerhat/actionscript-compiler-action/releases/download/v1.0.0/mxmlc.jar -O mxmlc.jar

    - name: Compile ActionScript to SWF
      run: |
        java -jar mxmlc.jar Main.as -output atherios-silver.swf

    - name: Upload SWF File
      uses: actions/upload-artifact@v4
      with:
        name: atherios-silver-swf
        path: atherios-silver.swf
