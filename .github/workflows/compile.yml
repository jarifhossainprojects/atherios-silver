name: Hax SWF Compiler

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Haxe & Neko
        run: |
          sudo apt-get update
          sudo apt-get install -y haxe neko

      - name: Install Libraries & Setup
        run: |
          mkdir -p ~/haxelib && haxelib setup ~/haxelib
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib run lime setup -y

      - name: Build Flash SWF
        run: |
          haxelib run lime build flash

      - name: Upload atherios-silver.swf
        uses: actions/upload-artifact@v4
        with:
          name: atherios-silver-swf
          path: export/flash/bin/atherios-silver.swf
